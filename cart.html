<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Luxury Cart</title>

    <!-- GOOGLE FONTS -->

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Cormorant+Garamond:wght@400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- ICONS -->

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

    <style>
        /* ===================================
ROOT
=================================== */

        :root {

            --bg: #f7f4ef;
            --card: #ffffff;

            --text: #111111;
            --light-text: #666;

            --primary: #1E4D45;
            --gold: #c8a96b;

            --border: rgba(0, 0, 0, .08);

            --shadow:
                0 10px 40px rgba(0, 0, 0, .06);

        }

        /* ===================================
GLOBAL
=================================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {

            background:
                linear-gradient(rgba(247, 244, 239, 0.88),
                    rgba(247, 244, 239, 0.88)),

                url("https://i.pinimg.com/1200x/38/24/34/382434f5f6836b54865b318787d50171.jpg");

            background-size: cover;

            background-position: center;

            background-repeat: no-repeat;

            background-attachment: fixed;

            color: var(--text);

            overflow-x: hidden;

            min-height: 100vh;
        }

        /* ===================================
HERO
=================================== */

        .cart-hero {

            min-height: 45vh;

            padding: 140px 8% 80px;

            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 50px;

            background:

                linear-gradient(to right,
                    rgba(255, 255, 255, .94),
                    rgba(255, 255, 255, .75)),

                url("https://images.unsplash.com/photo-1522335789203-aabd1fc54bc9?q=80&w=1400&auto=format&fit=crop");

            background-size: cover;
            background-position: center;
        }

        .hero-content h1 {

            font-size: 78px;

            font-family: 'Cormorant Garamond', serif;

            margin-bottom: 20px;
        }

        .hero-content p {

            font-size: 18px;

            color: var(--light);

            margin-bottom: 35px;
        }

        .back-btn {

            display: inline-flex;

            align-items: center;
            gap: 12px;

            padding: 14px 28px;

            background: white;

            color: var(--primary);

            border-radius: 50px;

            font-weight: 600;

            box-shadow: 0 10px 30px rgba(0, 0, 0, .08);

            transition: .3s;

            margin: 40px 8% 0;
        }

        .back-btn:hover {
            transform: translateY(-3px);

            background: var(--primary);

            color: white;
        }

        /* ===================================
CART SECTION
=================================== */

        .cart-section {

            padding: 90px 8%;
        }

        .cart-container {

            display: grid;

            grid-template-columns: 2fr 1fr;

            gap: 40px;
        }

        /* ===================================
CART ITEMS
=================================== */

        .cart-items {

            background: rgba(255, 255, 255, .7);

            backdrop-filter: blur(16px);

            padding: 35px;

            border-radius: 35px;

            box-shadow: var(--shadow);

            border: 1px solid rgba(255, 255, 255, .5);
        }

        .cart-item {

            display: grid;

            grid-template-columns:
                120px 1fr 120px 160px 120px 70px;

            gap: 20px;

            align-items: center;

            padding: 30px 0;

            border-bottom: 1px solid #eee;
        }

        .cart-item:last-child {

            border-bottom: none;
        }

        .cart-item img {

            width: 110px;
            height: 110px;

            border-radius: 24px;

            object-fit: cover;
        }

        .product-info h3 {

            font-size: 24px;

            margin-bottom: 10px;
        }

        .product-info p {

            color: var(--light);

            margin-bottom: 6px;
        }

        .price {

            font-size: 20px;

            font-weight: 600;

            color: var(--primary);
        }

        /* ===================================
QUANTITY
=================================== */

        .quantity {

            display: flex;

            align-items: center;

            justify-content: center;

            gap: 14px;
        }

        .quantity button {

            width: 42px;
            height: 42px;

            border: none;

            border-radius: 50%;

            background: var(--primary);

            color: white;

            font-size: 18px;

            cursor: pointer;

            transition: .3s;
        }

        .quantity button:hover {

            transform: scale(1.08);
        }

        .quantity span {

            font-size: 18px;

            font-weight: 600;
        }

        /* ===================================
REMOVE
=================================== */

        .remove-btn {

            width: 42px;
            height: 42px;

            border: none;

            border-radius: 50%;

            background: #ff4d6d;

            color: white;

            cursor: pointer;

            transition: .3s;
        }

        .remove-btn:hover {

            transform: scale(1.08);
        }

        /* ===================================
SUMMARY
=================================== */

        .summary {

            background: white;

            padding: 40px;

            border-radius: 35px;

            box-shadow: var(--shadow);

            height: fit-content;

            position: sticky;

            top: 120px;
        }

        .summary h2 {

            font-size: 38px;

            font-family: 'Cormorant Garamond', serif;

            margin-bottom: 35px;
        }

        .summary-row {

            display: flex;

            justify-content: space-between;

            margin-bottom: 22px;

            font-size: 16px;
        }

        .summary-row.total {

            margin-top: 25px;

            padding-top: 25px;

            border-top: 1px solid #eee;

            font-size: 22px;

            font-weight: 700;
        }

        .free {

            color: #1E4D45;

            font-weight: 600;
        }

        .tax {

            color: #666;
        }

        .savings {

            margin-top: 10px;

            color: #1E4D45;

            font-weight: 500;
        }

        /* ===================================
CHECKOUT BUTTON
=================================== */

        .checkout-btn {

            width: 100%;

            padding: 18px;

            margin-top: 35px;

            border: none;

            border-radius: 50px;

            background: linear-gradient(135deg,
                    #1E4D45,
                    #2f7a6d);

            color: white;

            font-size: 17px;

            font-weight: 600;

            cursor: pointer;

            transition: .4s;
        }

        .checkout-btn:hover {

            transform: translateY(-4px);
        }

        /* ===================================
EMPTY
=================================== */

        .empty {

            text-align: center;

            padding: 100px 20px;
        }

        .empty i {

            font-size: 80px;

            margin-bottom: 20px;

            color: #ccc;
        }

        .empty h2 {

            font-size: 42px;

            margin-bottom: 15px;

            font-family: 'Cormorant Garamond', serif;
        }

        .empty p {

            color: #666;
        }

        /* ===================================
LUXURY CART DARK MODE
=================================== */

        body.dark-mode {



            background:
                linear-gradient(rgba(54, 52, 52, 0.92),
                    rgba(61, 60, 60, 0.92)),
                url("https://i.pinimg.com/1200x/0f/f2/b2/0ff2b26fa88eefac050751a1a84832cf.jpg");

            background-size: cover;
            background-position: center;
            background-attachment: fixed;

            color: #f5f5f5;
        }

        /* HERO */

        body.dark-mode .cart-hero {

            background:
                linear-gradient(rgba(255, 255, 255, 0.75),
                    rgba(255, 255, 255, 0.75)),
                url("https://images.unsplash.com/photo-1522335789203-aabd1fc54bc9?q=80&w=1400&auto=format&fit=crop");

            background-size: cover;
            background-position: center;
        }

        body.dark-mode .hero-content h1 {

            color: #4b9387;
        }

        body.dark-mode .hero-content p {

            color: #d0d0d0;
        }

        /* BACK BUTTON */

        body.dark-mode .back-btn {

            background: rgba(22, 26, 32, .95);

            color: #4b9387;

            border: 1px solid rgba(212, 175, 55, .15);
        }

        body.dark-mode .back-btn:hover {

            background: #4b9387;

            color: #111;
        }

        /* CART ITEMS */

        body.dark-mode .cart-items {

            background: rgba(20, 24, 30, .82);

            backdrop-filter: blur(20px);

            border: 1px solid rgba(212, 175, 55, .12);

            box-shadow:
                0 25px 70px rgba(0, 0, 0, .45);
        }

        body.dark-mode .cart-item {

            border-bottom:
                1px solid rgba(255, 255, 255, .08);
        }

        body.dark-mode .cart-item img {

            border: 1px solid rgba(212, 175, 55, .15);
        }

        /* PRODUCT INFO */

        body.dark-mode .product-info h3 {

            color: #ffffff;
        }

        body.dark-mode .product-info p {

            color: #c9c9c9;
        }

        body.dark-mode .price {

            color: #4b9387;
        }

        /* QUANTITY */

        body.dark-mode .quantity button {

            background: #4b9387;

            color: #111;
        }

        body.dark-mode .quantity span {

            color: #fff;
        }

        /* REMOVE BUTTON */

        body.dark-mode .remove-btn {

            background: #b93f55;
        }

        /* SUMMARY */

        body.dark-mode .summary {

            background: rgba(20, 24, 30, .88);

            backdrop-filter: blur(20px);

            border: 1px solid rgba(212, 175, 55, .12);

            box-shadow:
                0 25px 70px rgba(0, 0, 0, .45);
        }

        body.dark-mode .summary h2 {

            color: #fff;
        }

        body.dark-mode .summary-row {

            color: #f0f0f0;
        }

        body.dark-mode .summary-row.total {

            border-top:
                1px solid rgba(255, 255, 255, .08);
        }

        body.dark-mode .tax {

            color: #c9c9c9;
        }

        body.dark-mode .free {

            color: #fff;
        }

        body.dark-mode .savings {

            color: #4b9387;
        }

        /* CHECKOUT BUTTON */

        body.dark-mode .checkout-btn {

            background:
                linear-gradient(135deg,
                    #2d7065,
                    #50827a);

            color: #111;

            font-weight: 700;
        }

        body.dark-mode .checkout-btn:hover {

            transform: translateY(-4px);


        }

        /* EMPTY CART */

        body.dark-mode .empty i {

            color: #4b9387;
        }

        body.dark-mode .empty h2 {

            color: #ffffff;
        }

        body.dark-mode .empty p {

            color: #c9c9c9;
        }

        /* GOLD AMBIENT GLOW */

        body.dark-mode::before {

            content: "";

            position: fixed;

            inset: 0;

            pointer-events: none;

            z-index: -1;

            background:

                radial-gradient(circle at 15% 15%,
                    rgba(212, 175, 55, .08),
                    transparent 25%),

                radial-gradient(circle at 85% 75%,
                    rgba(212, 175, 55, .05),
                    transparent 30%);
        }

        /* ===================================
MOBILE
=================================== */

        @media(max-width:991px) {

            .cart-container {

                grid-template-columns: 1fr;
            }

            .cart-item {

                grid-template-columns: 1fr;

                text-align: center;
            }

            .cart-hero {

                flex-direction: column;

                text-align: center;
            }

            .hero-content h1 {

                font-size: 56px;
            }

        }

        /* ===================================
CART PAGE MOBILE RESPONSIVE
=================================== */

        @media(max-width:991px) {

            header {

                padding: 18px 5%;
            }

            nav {

                display: none;
            }

            .logo {

                font-size: 34px;
            }

            .cart-hero {

                padding: 120px 5% 70px;

                min-height: auto;
            }

            .cart-hero h1 {

                font-size: 60px;
            }

            .cart-container {

                grid-template-columns: 1fr;

                padding: 60px 5%;

                gap: 30px;
            }

            .cart-left,
            .cart-right {

                padding: 30px;

                border-radius: 28px;
            }

            .cart-item {

                grid-template-columns: 100px 1fr;

                gap: 20px;

                position: relative;
            }

            .cart-item img {

                width: 100px;
                height: 100px;
            }

            .price,
            .quantity,
            .cart-total {

                margin-top: 10px;
            }

            .remove-btn {

                position: absolute;

                top: 10px;
                right: 10px;
            }

            .summary-box {

                padding: 25px;
            }

            .checkout-btn {

                width: 100%;
            }

        }

        /* ===================================
SMALL MOBILE
=================================== */

        @media(max-width:600px) {

            header {

                padding: 16px 4%;
            }

            .cart-hero {

                padding: 110px 4% 60px;
            }

            .cart-hero h1 {

                font-size: 46px;
            }

            .cart-container {

                padding: 50px 4%;
            }

            .cart-left,
            .cart-right {

                padding: 22px;

                border-radius: 24px;
            }

            .cart-item {

                display: flex;

                flex-direction: column;

                align-items: flex-start;

                padding: 20px;
            }

            .cart-item img {

                width: 100%;
                height: 220px;

                object-fit: cover;

                border-radius: 18px;
            }

            .product-info {

                width: 100%;
            }

            .product-info h3 {

                font-size: 20px;
            }

            .price {

                font-size: 18px;

                font-weight: 600;
            }

            .quantity {

                width: 100%;

                justify-content: space-between;
            }

            .quantity button {

                width: 40px;
                height: 40px;
            }

            .cart-total {

                font-size: 24px;
            }

            .summary-box {

                padding: 22px;
            }

            .summary-row {

                font-size: 14px;
            }

            .final-total {

                font-size: 24px;
            }

            .checkout-btn {

                width: 100%;

                padding: 16px;
            }

            .back-shopping {

                width: 100%;

                justify-content: center;
            }

            .empty {

                padding: 50px 20px;
            }

            .empty i {

                font-size: 60px;
            }

            .empty h2 {

                font-size: 28px;
            }

        }
    </style>

</head>

<body>


    <a href="shop.html" class="back-btn" style="text-decoration: none;">

        <i class="fa-solid fa-arrow-left"></i>

        Continue Shopping

    </a>


    <!-- ===================================
CART
=================================== -->

    <section class="cart-section">

        <div class="cart-container">

            <!-- CART ITEMS -->

            <div class="cart-items" id="cartItems">

            </div>

            <!-- SUMMARY -->

            <div class="summary">

                <h2>Order Summary</h2>

                <div class="summary-row">

                    <span>Subtotal</span>

                    <span id="subtotal">₹0</span>

                </div>

                <div class="summary-row">

                    <span>Shipping</span>

                    <span class="free" id="shipping">

                        FREE

                    </span>

                </div>

                <div class="summary-row">

                    <span>Tax</span>

                    <span class="tax" id="tax">

                        ₹0

                    </span>

                </div>

                <div class="summary-row total">

                    <span>Total</span>

                    <span id="finalTotal">

                        ₹0

                    </span>

                </div>

                <div class="savings">

                    You're saving ₹109.00

                </div>

                <a href="checkout.html">

                    <button class="checkout-btn">

                        <i class="fa-solid fa-lock"></i>

                        Proceed To Checkout

                    </button>

                </a>

            </div>

        </div>

    </section>

    <script>

        // ===================================
        // LOAD CART
        // ===================================

        let cart =
            JSON.parse(localStorage.getItem("cart")) || [];

        const cartItems =
            document.getElementById("cartItems");

        // ===================================
        // RENDER CART
        // ===================================

        function renderCart() {

            cartItems.innerHTML = "";

            let subtotal = 0;

            if (cart.length === 0) {

                cartItems.innerHTML =

                    `
<div class="empty">

<i class="fa-solid fa-cart-shopping"></i>

<h2>Your Cart Is Empty</h2>

<p>
Looks like you haven't added
anything yet.
</p>

</div>
`;

                document.getElementById("subtotal")
                    .innerText = "₹0";

                document.getElementById("tax")
                    .innerText = "₹0";

                document.getElementById("finalTotal")
                    .innerText = "₹0";

                return;
            }

            cart.forEach((item, index) => {

                const price =
                    typeof item.price === "string"
                        ? parseFloat(item.price.replace("₹", ""))
                        : Number(item.price);

                const total =
                    price * item.quantity;

                subtotal += total;

                cartItems.innerHTML +=

                    `
<div class="cart-item">

<img src="${item.image}">

<div class="product-info">

<h3>${item.name}</h3>

<p>${item.category}</p>

<p>Size: ${item.size}</p>

</div>

<div class="price">

${item.price}

</div>

<div class="quantity">

<button onclick="decreaseQty(${index})">

-

</button>

<span>

${item.quantity}

</span>

<button onclick="increaseQty(${index})">

+

</button>

</div>

<h3>

₹${total.toFixed(2)}

</h3>

<button class="remove-btn"
onclick="removeItem(${index})">

<i class="fa-solid fa-xmark"></i>

</button>

</div>
`;

            });

            // ===================================
            // CALCULATIONS
            // ===================================

            const shipping =
                subtotal > 60 ? 0 : 8;

            const tax =
                subtotal * 0.08;

            const finalTotal =
                subtotal + shipping + tax;

            // UPDATE UI

            /* UPDATE UI */

            document.getElementById("subtotal")
                .innerText =
                `₹${subtotal.toFixed(2)}`;

            document.getElementById("shipping")
                .innerText =
                shipping === 0
                    ? "FREE"
                    : `₹${shipping.toFixed(2)}`;

            document.getElementById("tax")
                .innerText =
                `₹${tax.toFixed(2)}`;

            document.getElementById("finalTotal")
                .innerText =
                `₹${finalTotal.toFixed(2)}`;

            // SAVE

            localStorage.setItem(
                "cart",
                JSON.stringify(cart)
            );

        }

        // ===================================
        // INCREASE
        // ===================================

        function increaseQty(index) {

            cart[index].quantity++;

            renderCart();

        }

        // ===================================
        // DECREASE
        // ===================================

        function decreaseQty(index) {

            if (cart[index].quantity > 1) {

                cart[index].quantity--;

                renderCart();

            }

        }

        // ===================================
        // REMOVE
        // ===================================

        function removeItem(index) {

            cart.splice(index, 1);

            renderCart();

        }

        // ===================================
        // INITIAL
        // ===================================

        renderCart();

        /* APPLY SAVED DARK MODE */

        if (localStorage.getItem("darkMode") === "enabled") {
            document.body.classList.add("dark-mode");
        }

    </script>
    <script src="script.js"></script>
</body>

</html>
